spring.application.name=keiba-app

spring.datasource.url=jdbc:postgresql://localhost:5432/keibadb
spring.datasource.username=keiba
spring.datasource.password=keiba

spring.jpa.hibernate.ddl-auto=update

discord.webhook.url=${DISCORD_WEBHOOK_URL:}

# @Scheduledのスレッド数(デフォルト1)。毎分の通知チェックが、毎時のキャッシュ更新や
# 30分おきの結果収集(数十秒〜数分かかる)の後ろで待たされると、発走2分前の
# 通知ウィンドウを丸ごと逃してしまうため、重いジョブと並行して動けるようにする
spring.task.scheduling.pool.size=3